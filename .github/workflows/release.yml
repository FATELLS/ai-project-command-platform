name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_RUNTIME_VERSION: "20.19.5"

jobs:
  # ── Linux ARM64 ───────────────────────────────────────────────
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm
      - run: npm ci
      - name: Install native runtime dependencies (libaio, OpenSSL 1.1)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libaio1t64 libssl1.1 || {
            sudo apt-get install -y -qq libaio1 || true
            # Ubuntu 24.04: libaio1t64 renames libaio.so.1 to libaio.so.1t64
            if [ -f /usr/lib/aarch64-linux-gnu/libaio.so.1t64 ] && [ ! -f /usr/lib/aarch64-linux-gnu/libaio.so.1 ]; then
              sudo ln -s /usr/lib/aarch64-linux-gnu/libaio.so.1t64 /usr/lib/aarch64-linux-gnu/libaio.so.1
            fi
            # Ubuntu 24.04: no libssl1.1 package, download from Ubuntu 22.04
            if [ ! -f /usr/lib/aarch64-linux-gnu/libcrypto.so.1.1 ]; then
              wget -q http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_arm64.deb -O /tmp/libssl11.deb && \
              sudo dpkg -i /tmp/libssl11.deb || true
            fi
          }
      - name: Download Node.js runtime
        run: |
          curl -fsSL "https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}/node-v${NODE_RUNTIME_VERSION}-linux-arm64.tar.xz" -o "$RUNNER_TEMP/node.tar.xz"
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node"
      - name: Assemble portable release
        run: |
          name="ai-project-command-platform-linux-arm64"
          node scripts/assemble-release.mjs --target linux-arm64 --runtime "$RUNNER_TEMP/node/node-v${NODE_RUNTIME_VERSION}-linux-arm64" --output "dist/$name"
          mkdir -p artifacts
          tar -czf "artifacts/${name}.tar.gz" -C dist "$name"
      - name: Smoke test (native mode)
        run: |
          app="$PWD/dist/ai-project-command-platform-linux-arm64"
          cd "$app"
          export HOST=127.0.0.1 PORT=4173 XUGU_PORT=55139
          export PLATFORM_XUGU_LIFECYCLE=native
          export PLATFORM_BOOTSTRAP_PASSWORD=release-smoke-password
          export PLATFORM_DATA_DIR=./data
          ./start.sh &
          sleep 10
          curl --fail --retry 30 --retry-delay 2 http://127.0.0.1:4173/health || { echo "=== Health check failed ==="; cat app.log 2>/dev/null || true; cat xugu-server.log 2>/dev/null || true; exit 1; }
          ./stop.sh || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: artifacts/*

  # ── Linux x86_64 ──────────────────────────────────────────────
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm
      - run: npm ci
      - name: Download Node.js runtime
        run: |
          curl -fsSL "https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}/node-v${NODE_RUNTIME_VERSION}-linux-x64.tar.xz" -o "$RUNNER_TEMP/node.tar.xz"
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node"
      - name: Assemble portable release
        run: |
          name="ai-project-command-platform-linux-x86_64"
          node scripts/assemble-release.mjs --target linux-x86_64 --runtime "$RUNNER_TEMP/node/node-v${NODE_RUNTIME_VERSION}-linux-x64" --output "dist/$name"
          mkdir -p artifacts
          tar -czf "artifacts/${name}.tar.gz" -C dist "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/*

  # ── Windows amd64 ─────────────────────────────────────────────
  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm
      - run: npm ci
      - name: Download Node.js runtime
        shell: pwsh
        run: |
          curl -fsSL "https://nodejs.org/dist/v${{ env.NODE_RUNTIME_VERSION }}/node-v${{ env.NODE_RUNTIME_VERSION }}-win-x64.zip" -o "$env:RUNNER_TEMP\node.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\node.zip" -DestinationPath "$env:RUNNER_TEMP\node" -Force
      - name: Assemble portable release
        shell: pwsh
        run: |
          $name = "ai-project-command-platform-windows-amd64"
          node scripts/assemble-release.mjs --target windows-amd64 --runtime "$env:RUNNER_TEMP\node\node-v${{ env.NODE_RUNTIME_VERSION }}-win-x64" --output "dist\$name"
          New-Item -ItemType Directory -Path artifacts -Force
          Compress-Archive -Path "dist\$name" -DestinationPath "artifacts\$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: artifacts/*

  # ── macOS ARM64 ───────────────────────────────────────────────
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm
      - run: npm ci
      - name: Download Node.js runtime
        run: |
          curl -fsSL "https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}/node-v${NODE_RUNTIME_VERSION}-darwin-arm64.tar.xz" -o "$RUNNER_TEMP/node.tar.xz"
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node"
      - name: Assemble portable release
        run: |
          name="ai-project-command-platform-macos-arm64"
          node scripts/assemble-release.mjs --target macos-arm64 --runtime "$RUNNER_TEMP/node/node-v${NODE_RUNTIME_VERSION}-darwin-arm64" --output "dist/$name"
          mkdir -p artifacts
          tar -czf "artifacts/${name}.tar.gz" -C dist "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/*

  # ── 发布到 GitHub Releases ────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-arm64, linux-x86_64, windows-amd64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Copy install scripts
        run: |
          cp scripts/install.sh artifacts/install.sh
          cp scripts/install.ps1 artifacts/install.ps1
          chmod +x artifacts/install.sh
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          gh release create "${GITHUB_REF_NAME}" ./* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AI Project Command Platform ${GITHUB_REF_NAME}" \
            --notes-file ../docs/RELEASE-NOTES.md \
            || \
          gh release create "${GITHUB_REF_NAME}" ./* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AI Project Command Platform ${GITHUB_REF_NAME}" \
            --generate-notes
