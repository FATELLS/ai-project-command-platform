name: Build Xugu release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_RUNTIME_VERSION: "20.19.5"

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm
      - run: npm ci
      - name: Verify bundled Xugu image
        run: |
          archive="vendor/xugudb/image/xugudb-12.9.10-arm64.tar.gz"
          expected="$(node -p "require('./vendor/xugudb/image/manifest.json').archiveSha256")"
          echo "$expected  $archive" | sha256sum --check
          docker load --input "$archive"
      - name: Download bundled Node.js runtime
        run: |
          curl -fsSL "https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}/node-v${NODE_RUNTIME_VERSION}-linux-arm64.tar.xz" -o "$RUNNER_TEMP/node.tar.xz"
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node"
      - name: Assemble portable release
        run: |
          version="$(node -p "require('./package.json').version")"
          name="ai-project-command-platform-${version}-linux-arm64"
          node scripts/assemble-release.mjs --target linux-arm64 --runtime "$RUNNER_TEMP/node/node-v${NODE_RUNTIME_VERSION}-linux-arm64" --output "dist/$name"
          mkdir -p artifacts
          tar -czf "artifacts/$name.tar.gz" -C dist "$name"
      - name: Smoke test complete Xugu stack
        run: |
          version="$(node -p "require('./package.json').version")"
          app="$PWD/dist/ai-project-command-platform-${version}-linux-arm64"
          cd "$app"
          export HOST=127.0.0.1 PORT=4173 XUGU_PORT=55139
          export XUGU_CONTAINER=ai-platform-release-smoke XUGU_VOLUME=ai-platform-release-smoke-data
          export PLATFORM_BOOTSTRAP_PASSWORD=release-smoke-password
          ./start.sh
          trap './stop.sh || true; docker rm -f "$XUGU_CONTAINER" 2>/dev/null || true; docker volume rm "$XUGU_VOLUME" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:4173/health
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: artifacts/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" ./* --repo "${GITHUB_REPOSITORY}" --title "AI Project Command Platform ${GITHUB_REF_NAME}" --generate-notes
